name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Flashdrivefixer.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - run: gradle assembleDebug --no-daemon
        working-directory: Flashdrivefixer 
      - uses: actions/upload-artifact@v4
        with:
          name: Flashdrivefixer-apk
          path: Flashdrivefixer/app/build/outputs/apk/debug/app-debug.apk
